name: Linux CGO build and tests

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    name: Debian 13 amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:13
      options: --privileged
    env:
      CGO_ENABLED: '1'
      LIBGUESTFS_BACKEND: direct
      LIBGUESTFS_BACKEND_SETTINGS: force_tcg
      GO_VERSION: '1.27.3'
    steps:
      - name: Install native build and appliance dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libguestfs-dev libcrypt-dev \
            libguestfs-tools libguestfs-xfs fuse3 qemu-system-x86 linux-image-amd64 shellcheck jq
          if [ ! -e /dev/fuse ]; then mknod /dev/fuse c 10 229; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify formatting, dependencies, and shell scripts
        run: |
          test -z "$(gofmt -l main.go internal)" || { gofmt -l main.go internal; exit 1; }
          go mod verify
          shellcheck scripts/*.sh
          sh scripts/test-build.sh
          make
      - name: Vet and unit tests against native libguestfs
        run: |
          go vet ./...
          go test -race -timeout 10m ./...
      - name: Linux disk-image integration tests
        run: go test -v -tags integration -timeout 15m ./internal/appliance
      - name: Build and inspect native executable
        run: |
          mkdir -p dist
          sh scripts/build.sh dist/pvedisk
          ldd dist/pvedisk
          dist/pvedisk --help
          expected_version=$(cat VERSION)
          test "$(dist/pvedisk version --short)" = "$expected_version"
          test "$(dist/pvedisk --version)" = "$expected_version"
          dist/pvedisk version
          dist/pvedisk version --json | jq -e \
            --arg version "$expected_version" --arg commit "$GITHUB_SHA" \
            '.version == $version and .commit == $commit and .source == "github" and .os == "linux" and .arch == "amd64" and .go_version == "go1.27.3" and (.build_date | fromdateiso8601 | . <= now and . >= now - 600)'
          cd dist
          sha256sum pvedisk > SHA256SUMS
      - name: Verify installation on this Debian version
        run: |
          sh scripts/install.sh --artifact-dir "$PWD/dist"
          /usr/local/bin/pvedisk --help
          /usr/local/bin/pvedisk version
          /usr/local/bin/pvedisk version --short
          /usr/local/bin/pvedisk version --json
          test ! -e /etc/pvedisk/config.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: native-pvedisk
          path: dist/pvedisk
          if-no-files-found: error

  artifacts:
    name: Checksummed release bundle
    runs-on: ubuntu-24.04
    needs: debian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-pvedisk
          path: dist
      - name: Package installer, licenses, and checksum manifest
        run: |
          cp scripts/install.sh dist/install.sh
          cp LICENSE dist/LICENSE
          cp third_party/guestfs/COPYING.LIB dist/COPYING.LIB
          cp deploy/pvedisk-mcp.service dist/pvedisk-mcp.service
          cp docs/recovery.md dist/recovery.md
          cp docs/selinux.md dist/selinux.md
          cp docs/mcp-shared-package.md dist/mcp-shared-package.md
          sed 's|../deploy/pvedisk-mcp.service|pvedisk-mcp.service|g' docs/mcp.md > dist/MCP.md
          cd dist
          sha256sum pvedisk install.sh LICENSE COPYING.LIB pvedisk-mcp.service recovery.md selinux.md MCP.md mcp-shared-package.md > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pvedisk-linux-amd64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [artifacts, installation]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pvedisk-linux-amd64
          path: dist
      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
      - name: Publish raw binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes

  installation:
    name: Clean Debian 13 installation
    runs-on: ubuntu-24.04
    needs: artifacts
    timeout-minutes: 15
    container:
      image: debian:13
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pvedisk-linux-amd64
          path: dist
      - name: Install and execute without a compiler or Go toolchain
        run: |
          sh dist/install.sh --artifact-dir "$PWD/dist"
          /usr/local/bin/pvedisk --help
          /usr/local/bin/pvedisk version
          /usr/local/bin/pvedisk version --short
          /usr/local/bin/pvedisk version --json
          if command -v go || command -v gcc; then
            echo 'The runtime verification container unexpectedly contains a compiler.' >&2
            exit 1
          fi
          test ! -e /etc/pvedisk/config.yaml
