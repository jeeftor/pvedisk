stages:
  - build
  - verify

default:
  tags:
    - mitre-no-cui-prd

variables:
  DEBIAN_VERSION: "13"
  CGO_ENABLED: "1"
  GOTOOLCHAIN: local
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  LIBGUESTFS_BACKEND: direct
  LIBGUESTFS_BACKEND_SETTINGS: force_tcg

.native:
  image: debian:13
  timeout: 30m
  cache:
    key:
      prefix: go1.27.3-debian13
      files:
        - go.sum
    paths:
      - .cache/go-mod/
      - .cache/go-build/

.build:
  extends: .native
  stage: build
  script:
    - sh scripts/gitlab-build.sh build
  artifacts:
    name: "pvedisk-debian13-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - dist/

build-debian13:
  extends: .build

.integration:
  extends: .native
  stage: verify
  script:
    - sh scripts/gitlab-build.sh integration

# These required checks need a Docker runner with CAP_SYS_ADMIN and /dev/fuse.
# Their isolation preserves build artifacts if a runner cannot provide FUSE.
integration-debian13:
  extends: .integration
  needs:
    - job: build-debian13
      artifacts: false

.installation:
  stage: verify
  image: debian:13
  timeout: 20m
  script:
    - sh scripts/gitlab-build.sh installation

installation-debian13:
  extends: .installation
  needs:
    - job: build-debian13
      artifacts: true
