stages:
  - build
  - verify

default:
  tags:
    - mitre-no-cui

variables:
  CGO_ENABLED: "1"
  GOTOOLCHAIN: local
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  LIBGUESTFS_BACKEND: direct
  LIBGUESTFS_BACKEND_SETTINGS: force_tcg

.native:
  image: "debian:${DEBIAN_VERSION}"
  timeout: 30m
  cache:
    key:
      prefix: "go1.27.3-debian${DEBIAN_VERSION}"
      files:
        - go.sum
    paths:
      - .cache/go-mod/
      - .cache/go-build/

.build:
  extends: .native
  stage: build
  script:
    - sh scripts/gitlab-build.sh build
  artifacts:
    name: "pvedisk-debian${DEBIAN_VERSION}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 30 days
    paths:
      - "dist/debian${DEBIAN_VERSION}/"

build-debian12:
  extends: .build
  variables:
    DEBIAN_VERSION: "12"

build-debian13:
  extends: .build
  variables:
    DEBIAN_VERSION: "13"

.integration:
  extends: .native
  stage: verify
  script:
    - sh scripts/gitlab-build.sh integration

# These required checks need a Docker runner with CAP_SYS_ADMIN and /dev/fuse.
# Their isolation preserves build artifacts if a runner cannot provide FUSE.
integration-debian12:
  extends: .integration
  variables:
    DEBIAN_VERSION: "12"
  needs:
    - job: build-debian12
      artifacts: false

integration-debian13:
  extends: .integration
  variables:
    DEBIAN_VERSION: "13"
  needs:
    - job: build-debian13
      artifacts: false

.installation:
  stage: verify
  image: "debian:${DEBIAN_VERSION}"
  timeout: 20m
  script:
    - sh scripts/gitlab-build.sh installation

installation-debian12:
  extends: .installation
  variables:
    DEBIAN_VERSION: "12"
  needs:
    - job: build-debian12
      artifacts: true

installation-debian13:
  extends: .installation
  variables:
    DEBIAN_VERSION: "13"
  needs:
    - job: build-debian13
      artifacts: true
